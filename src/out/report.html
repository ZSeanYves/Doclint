<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doclint Report</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; padding:24px; background:#fafafa;}.card{background:#fff; border:1px solid #eee; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.04);}.kpi{display:flex; gap:12px; flex-wrap:wrap;}.kpi .box{padding:10px 12px; border:1px solid #eee; border-radius:10px; background:#fff;}h1{font-size:20px; margin:0 0 12px 0;}h2{font-size:16px; margin:16px 0 8px 0;}table{width:100%; border-collapse:collapse; background:#fff; border:1px solid #eee; border-radius:12px; overflow:hidden;}th,td{padding:10px 12px; border-bottom:1px solid #eee; text-align:left; vertical-align:top;}th{background:#f6f7f9; font-weight:600;}tr:last-child td{border-bottom:none;}.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #eee; background:#fff;}.badge.error{border-color:#f3c2c2; background:#fff5f5;}.badge.warn{border-color:#f2d6a5; background:#fffaf2;}.badge.info{border-color:#b8d4ff; background:#f3f8ff;}.muted{color:#666; font-size:12px;}</style></head><body><div class="card"><h1>Doclint Report</h1><div class="kpi"><div class="box"><div class="muted">Total</div><div>2</div></div><div class="box"><div class="muted">Error</div><div>2</div></div><div class="box"><div class="muted">Warn</div><div>0</div></div><div class="box"><div class="muted">Info</div><div>0</div></div></div></div><div class="card"><h2>Errors</h2><table><thead><tr><th>rule_id</th><th>severity</th><th>message</th><th>location</th></tr></thead><tbody><tr><td><code>thesis.page_limit</code></td><td><span class="badge error">Error</span></td><td>页数不符合要求</td><td></td></tr><tr><td><code>basic.require_abstract</code></td><td><span class="badge error">Error</span></td><td>缺少必需内容：摘要</td><td></td></tr></tbody></table></div><div class="card"><h2>Warnings</h2><div class="muted">(none)</div></div><div class="card"><h2>Infos</h2><div class="muted">(none)</div></div></body></html>
